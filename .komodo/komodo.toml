# Build local e atualização nativa do Swarm. Sem registry ou deploy no GitHub.

[[repo]]
name = "chamados_prod"
tags = ["context:apps", "env:core", "server:core"]
[repo.config]
server = "core"
git_provider = "github.com"
git_account = "grupo-azuos"
repo = "grupo-azuos/chamados"
branch = "main"
webhook_enabled = true
env_file_path = ".komodo/bootstrap.env"
environment = """
INFISICAL_TOKEN=[[INFISICAL_PROD_TOKEN]]
INFISICAL_DOMAIN=[[INFISICAL_API_URL]]
"""
[repo.config.on_pull]
path = "."
shell_mode = true
command = '''
set -eu
# Auxiliares do deploy, construídas no host uma vez e reaproveitadas. São iguais em todos os apps e
# no Ansible do server: mudou um dockerfile, sobe a tag aqui, nos outros apps e no Ansible.
docker image inspect azuos-deploy-tools:1 >/dev/null 2>&1 || \
  docker build -t azuos-deploy-tools:1 .komodo/runtime/deploy-tools
docker image inspect azuos-gateway:2.11 >/dev/null 2>&1 || \
  docker build -t azuos-gateway:2.11 .komodo/runtime/gateway
chmod 600 .komodo/bootstrap.env
docker run --rm --security-opt label=disable --network host \
  --env-file .komodo/bootstrap.env \
  -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0="$PWD" \
  -v /var/run/docker.sock:/var/run/docker.sock \
  -v /etc/komodo/buildx:/etc/komodo/buildx:z \
  -v "$PWD:$PWD:ro,z" -w "$PWD/chamados/dashboard" azuos-deploy-tools:1 \
  infisical --silent run --expand=false --secret-overriding=false \
  --projectId='[[CHAMADOS_INFISICAL_PROJECT_ID]]' \
  --env=prod --path=/ \
  -- sh docker/deploy.sh prod prod
'''

