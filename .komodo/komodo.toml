# Deploy no Komodo. Igual em todos os apps; a base é o template e a regra está na skill
# komodo-deploy. Nome de tudo: <ambiente>_<app> (homo_chamados, prod_chamados); o Docker completa
# os serviços com _<serviço> (homo_chamados_app, homo_chamados_gateway).
#
#   Repo       clone do repositório no servidor do ambiente; Build e Stack leem dele.
#   Build      docker/dockerfile no builder do ambiente: imagem local azuos/<app>:<hash>-<ambiente>.
#   Stack      docker/compose.yml no Swarm; o Infisical só entra nas etapas de docker/komodo.sh.
#   Procedure  Pull → Build → Deploy, disparada pelo webhook do GitHub
#              (/listener/github/procedure/<ambiente>_<app>/<branch>).
#   Action     rollback nativo do Swarm para a versão anterior.

# ── homo (develop) ─────────────────────────────────────────────────────────────────────────────

[[repo]]
name = "homo_chamados"
description = "Clone da develop do chamados no homo"
tags = ["context:apps", "env:homo", "server:homo"]
[repo.config]
server = "homo"
git_provider = "github.com"
git_account = "grupo-azuos"
repo = "grupo-azuos/chamados"
branch = "develop"
webhook_enabled = false
links = ["https://github.com/grupo-azuos/chamados/tree/develop"]

[[build]]
name = "homo_chamados"
description = "Imagem azuos/chamados de homologação, construída no homo"
tags = ["context:apps", "env:homo", "server:homo"]
[build.config]
builder = "homo"
linked_repo = "homo_chamados"
webhook_enabled = false
build_path = "chamados/dashboard"
dockerfile_path = "docker/dockerfile"
image_name = "azuos/chamados"
image_tag = "homo"
include_latest_tag = false
include_version_tags = false
include_commit_tag = true
labels = """
org.opencontainers.image.source=https://github.com/grupo-azuos/chamados
azuos.app=chamados
azuos.environment=homo
"""
links = ["https://chamados.homo.grupoazuos.com.br"]

[[stack]]
name = "homo_chamados"
description = "Serviços do chamados no Swarm do homo"
tags = ["context:apps", "env:homo", "server:homo"]
[stack.config]
swarm = "homo"
project_name = "homo_chamados"
linked_repo = "homo_chamados"
webhook_enabled = false
run_directory = "chamados/dashboard"
file_paths = ["docker/compose.yml"]
extra_args = ["--resolve-image", "never", "--detach=false"]
links = ["https://chamados.homo.grupoazuos.com.br"]
pre_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[CHAMADOS_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh pre-deploy chamados homo
'''
compose_cmd_wrapper_include = ["config", "deploy"]
compose_cmd_wrapper = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[CHAMADOS_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh deploy chamados homo [[COMPOSE_COMMAND]]
'''
post_deploy.command = '''
INFISICAL_TOKEN='[[INFISICAL_HOMO_TOKEN]]' \
INFISICAL_DOMAIN='[[INFISICAL_API_URL]]' \
INFISICAL_PROJECT_ID='[[CHAMADOS_INFISICAL_PROJECT_ID]]' \
sh docker/komodo.sh post-deploy chamados homo
'''

[[procedure]]
name = "homo_chamados"
description = "Publica a develop do chamados no homo: Pull, Build e Deploy"
tags = ["context:apps", "env:homo", "server:homo"]
[procedure.config]
webhook_enabled = true

[[procedure.config.stage]]
name = "Pull"
executions = [
  { execution.type = "PullRepo", execution.params.repo = "homo_chamados" },
]

[[procedure.config.stage]]
name = "Build"
executions = [
  { execution.type = "RunBuild", execution.params.build = "homo_chamados" },
]

[[procedure.config.stage]]
name = "Deploy"
executions = [
  { execution.type = "DeployStack", execution.params.stack = "homo_chamados" },
]

[[action]]
name = "homo_chamados_rollback"
description = "Volta os serviços do homo_chamados para a versão anterior (rollback do Swarm)"
tags = ["context:apps", "env:homo", "server:homo"]
[action.config]
webhook_enabled = false
file_contents = '''
const stack = 'homo_chamados';
await komodo.execute_server_terminal(
  {
    server: 'homo',
    command: `docker service ls -q --filter label=com.docker.stack.namespace=${stack} | xargs -r -n1 docker service rollback --detach=false`,
    init: { command: 'sh' },
  },
  { onLine: (line) => console.log(line), onFinish: (code) => console.log(`exit ${code}`) },
);
'''

