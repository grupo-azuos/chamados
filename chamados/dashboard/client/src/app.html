<!doctype html>
<html lang="pt-BR" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="description" content="Sistema de chamados e atendimento interno do Grupo Azuos." />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#1b3a8c" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Chamados" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" href="%sveltekit.assets%/favicon.ico" sizes="any" />
    <link rel="icon" type="image/svg+xml" href="%sveltekit.assets%/favicon.svg" />
    <link
      rel="icon"
      type="image/svg+xml"
      href="%sveltekit.assets%/icon.svg"
      media="(prefers-color-scheme: dark)"
    />
    <link rel="apple-touch-icon" href="%sveltekit.assets%/apple-touch-icon.png" />
    <link
      rel="manifest"
      href="%sveltekit.assets%/manifest.webmanifest"
      crossorigin="use-credentials"
    />
    <title>Chamados · Grupo Azuos</title>
    <script>
      // O cookie do grupo vence a preferência antiga, antes da primeira pintura.
      (() => {
        let theme = 'dark';
        try {
          const cookie = document.cookie
            .split(';')
            .map((part) => part.trim())
            .find((part) => part.startsWith('azuos-theme='))
            ?.slice(12);
          const saved =
            cookie === 'light' || cookie === 'dark' ? cookie : localStorage.getItem('azuos-theme');
          if (saved === 'light' || saved === 'dark') theme = saved;
        } catch {
          /* Sem armazenamento, o tema escuro continua disponível. */
        }
        document.documentElement.setAttribute('data-theme', theme);
      })();
    </script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
