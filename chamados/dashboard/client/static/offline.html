<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#1b3a8c" />
    <title>Sem conexão · Chamados</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        min-height: 100vh;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right))
          max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
        background: #f8fafc;
        color: #0f172a;
        font:
          1rem/1.6 system-ui,
          sans-serif;
      }
      main {
        width: 100%;
        max-width: 28rem;
      }
      p {
        color: #475569;
      }
      a {
        display: inline-block;
        padding: 12px 20px;
        border-radius: 12px;
        background: #1b3a8c;
        color: white;
        font-weight: 600;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #1b3a8c;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Chamados · Grupo Azuos</p>
      <h1>Você está sem conexão</h1>
      <p>Conecte-se à internet para acessar o dashboard e seus chamados.</p>
      <a href="/">Tentar novamente</a>
    </main>
  </body>
</html>
