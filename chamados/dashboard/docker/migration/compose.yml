services:
  migrate:
    image: ${APP_IMAGE:?}
    command:
    - node
    - server/dist/lib/db/migrate.cli.js
    environment:
    - DATABASE_MIGRATION_URL
    - DATABASE_SSL_CA
    network_mode: host
    read_only: true
    cap_drop:
    - ALL
    tmpfs:
    - /tmp:size=64m,mode=1777
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 128
    healthcheck:
      disable: true
