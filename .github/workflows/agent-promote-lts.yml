name: Release/Promote agent LTS
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag publicada, no formato agent/vX.Y.Z"
        required: true
        type: string
permissions:
  contents: read
concurrency:
  group: agent-release
  cancel-in-progress: false
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Install storage SDK from the project lockfile
        working-directory: chamados/dashboard
        run: npm ci --ignore-scripts
      - name: Promote an existing release to LTS
        run: node .github/scripts/release/promote-agent-lts.mjs "$RELEASE_TAG"
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          S3_ENDPOINT: ${{ vars.S3_ENDPOINT }}
          S3_REGION: ${{ vars.S3_REGION }}
          S3_BUCKET: ${{ vars.S3_BUCKET || 'chamados' }}
          S3_FORCE_PATH_STYLE: ${{ vars.S3_FORCE_PATH_STYLE }}
          S3_ACCESS_KEY_ID: ${{ secrets.S3_ACCESS_KEY_ID }}
          S3_SECRET_ACCESS_KEY: ${{ secrets.S3_SECRET_ACCESS_KEY }}
