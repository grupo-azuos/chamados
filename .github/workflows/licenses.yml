# A LICENÇA DE CADA DEPENDÊNCIA, conferida a cada mudança.
#
# O projeto é MIT (ver LICENSE). Uma dependência com licença que obriga a abrir o código de
# quem a usa (GPL, AGPL...) ou sem licença declarada não pode entrar calada: aqui ela reprova
# o PR até alguém avaliar e, se for o caso, registrar uma exceção COM MOTIVO em
# `license-policy.json` — o equivalente, neste repositório, ao `deny.toml` do Rust.
#
# Roda separado do CI principal porque precisa das DUAS instalações de Node (painel e tela do
# agente) e do Go, que o `verify` não usa.
name: Licenças

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  licenses:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            chamados/dashboard/package-lock.json
            chamados/dashboard/bot/package-lock.json
            chamados/agent/svelte/package-lock.json

      - uses: actions/setup-go@v6
        with:
          go-version-file: chamados/agent/go.mod
          cache-dependency-path: chamados/agent/go.sum

      - name: Testes da regra de licenças
        run: node --test .github/scripts/licenses/license-policy.test.mjs

      # `--ignore-scripts`: só os arquivos interessam aqui. Nenhum script de instalação de
      # dependência precisa rodar para se ler a licença dela.
      - name: Instala as dependências do painel
        working-directory: chamados/dashboard
        run: npm ci --ignore-scripts

      # O bot de WhatsApp é um pacote à parte, com instalação própria (ver bot/README.md).
      - name: Instala as dependências do bot de WhatsApp
        working-directory: chamados/dashboard/bot
        run: npm ci --ignore-scripts

      - name: Instala as dependências da tela do agente
        working-directory: chamados/agent/svelte
        run: npm ci --ignore-scripts

      # `--strict`: aqui, o que não dá para conferir reprova — não vira aviso.
      - name: Confere as licenças (Node e Go)
        run: node .github/scripts/licenses/check-licenses.mjs --strict
