name: Release/Dashboard
on:
  push:
    tags: ["dashboard/v*"]
permissions:
  contents: read
concurrency:
  group: dashboard-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    permissions:
      contents: write
      packages: write
    env:
      DATABASE_URL: postgresql://ci:ci@localhost/ci_placeholder
      S3_ACCESS_KEY_ID: ci-placeholder
      S3_SECRET_ACCESS_KEY: ci-placeholder
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: chamados/dashboard/package-lock.json
      - name: Validate exact tag and main ancestry
        id: tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/release/version.mjs validate "$RELEASE_TAG"
      - name: Apply dashboard version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: node .github/scripts/release/version.mjs bump "$RELEASE_TAG"
      - uses: typst-community/setup-typst@v5
        with:
          typst-version: 0.15.1
      - name: Validate only dashboard workspaces
        working-directory: chamados/dashboard
        run: |
          npm ci
          npm run lint
          npm run typecheck
          npm test
          npm run test:e2e -w server
          npm run build
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}/dashboard" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - uses: docker/build-push-action@v6
        id: docker
        with:
          context: chamados/dashboard
          file: chamados/dashboard/docker/dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ steps.tag.outputs.version }}
            ${{ steps.image.outputs.name }}:latest
          labels: |
            org.opencontainers.image.version=${{ steps.tag.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Publish image coordinates as a GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
          IMAGE: ${{ steps.image.outputs.name }}
          VERSION: ${{ steps.tag.outputs.version }}
          DIGEST: ${{ steps.docker.outputs.digest }}
        run: |
          printf '{"image":"%s:%s","digest":"%s"}\n' "$IMAGE" "$VERSION" "$DIGEST" > dashboard-image.json
          if ! gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release create "$RELEASE_TAG" --verify-tag --title "Azuos Dashboard $RELEASE_TAG" --generate-notes --latest=false
          fi
          gh release upload "$RELEASE_TAG" dashboard-image.json --clobber
  bump:
    needs: build
    uses: ./.github/workflows/release-bump.yml
    permissions:
      contents: write
    secrets: inherit
