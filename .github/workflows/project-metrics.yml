name: Tests/Project Metrics

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  project-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Valida cadastro e testa atribuição
        run: |
          python3 .github/scripts/project-metrics/validate-metrics.py --check
          python3 .github/scripts/project-metrics/test-metrics.py
      - name: Confere os commits novos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: python3 .github/scripts/project-metrics/validate-metrics.py --range "$BASE_SHA" "$HEAD_SHA"
