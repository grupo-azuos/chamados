name: Tests/Project Metrics

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  project-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Valida o cadastro e testa as métricas
        run: |
          node .github/scripts/project-metrics/validate-metrics.mjs --check
          node --test '.github/scripts/project-metrics/*.test.mjs'
      - name: Confere os commits novos
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node .github/scripts/project-metrics/validate-metrics.mjs --range "$BASE_SHA" "$HEAD_SHA"
