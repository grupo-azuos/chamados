# A tag `dashboard/vX.Y.Z` na main vira a versão do sistema (API, tela e bot) em todo lugar:
# package.json, package-lock.json e os Builds do Komodo. O commit de bump vai para a main e para a
# develop, pelo mesmo `Release/Bump` do agent.
#
# Para lançar: git tag dashboard/v1.2.3 origin/main && git push origin dashboard/v1.2.3
name: Release/Dashboard

on:
  push:
    tags: ["dashboard/v*"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: A tag precisa estar na main
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::A tag ${GITHUB_REF_NAME} não aponta para um commit da main."
            exit 1
          }

  bump:
    needs: check
    permissions:
      contents: write
    uses: ./.github/workflows/release-bump.yml
    secrets: inherit
